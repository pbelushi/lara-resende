# Calibração do modelo de credibilidade fiscal.
#
# A parte de cima (até o marcador AUTO) é editável: parâmetros estruturais,
# critérios de sucesso e opções de estimação. Tudo abaixo do marcador é
# reescrito por `python run.py --atualizar-dados` (src/dados.py) a partir da
# última observação disponível das fontes públicas.

parametros:
  # Demanda agregada (IS)
  a1: 0.7          # persistência do hiato (0,5–0,85)
  a2: 0.15         # sensibilidade do hiato ao juro real longo (0,05–0,3)
  a3: 0.4          # multiplicador fiscal (0,2–0,8)
  a4: 0.8          # multiplicador do CAPEX (0,5–1,2)
  a5: 0.03         # efeito da depreciação real sobre o hiato (exportações líquidas)
  a6: 0.1          # perda de eficácia do CAPEX por p.p. de r_long acima de r_long_neutro
  # Phillips
  b1: 0.6          # inércia inflacionária (0,4–0,8)
  b2: 0.15         # inclinação da Phillips (0,05–0,3)
  b3: 0.06         # repasse cambial (0,03–0,12)
  # Taylor
  rho: 0.8         # suavização (0,6–0,9)
  phi_pi: 1.5
  phi_h: 0.5
  r_neutro_base: 5.0   # juro real curto neutro: Selic real neutra (4,5 na variante neutro_45)
  r_long_neutro: 5.5   # juro real longo neutro: NTN-B 10 anos em estado estacionário (grade 4,5; 5,5; 6,5)
                       # tp_lp = r_long_neutro − r_neutro_base (derivado, pode ser negativo)
  omega: 0.0           # fração dos desvios do prêmio que passa pela Taylor (0; 0,5; 1); 1 − ω vai ao juro longo
  pi_meta: 3.0
  i_min: 2.0       # piso nominal da Selic
  # Expectativas e inconsistência
  kappa: 0.5       # força da desancoragem (0,2–1,0)
  mu: 0.25         # peso do hiato fiscal (p.p. do PIB) no índice de inconsistência
  # Prêmio de risco (p.p. a.a.)
  p0: 1.5          # prêmio médio (não entra no nível dos juros: já está nos juros neutros)
  p1: 0.03         # por p.p. de dívida acima de d_ref
  p2: 0.3          # por p.p. de primário abaixo do estabilizador
  p3: 0.3          # por unidade do índice de inconsistência (ver README: índice em p.p.)
  d_ref: 70.0      # dívida bruta de referência (% PIB)
  prem_min: 0.3
  # Câmbio (depreciação trimestral, %)
  c1: 1.0          # por p.p. de variação da Selic
  c2: 2.0          # por p.p. de variação do prêmio
  c3: 2.0          # por % do PIB (US$) vendido em reservas no trimestre
  c4: 0.5          # fuga por desconfiança, por unidade de inconsistência
  eta: 1.0         # eficácia decrescente da intervenção: (R/R_inicial)^eta
  i_ext: 4.0       # juro externo (% a.a.)
  pi_ext: 2.0      # inflação externa (% a.a.), para o câmbio real
  # Reservas
  rend_reservas: 4.0   # rendimento das reservas (% a.a., em US$)
  R_min: 300.0     # piso de adequação (US$ bi): 100% da métrica ARA do FMI (antes 250, ≈ 83% da ARA)
  R_min_defesa: 0.0   # a defesa do câmbio na parada súbita pode romper R_min (limitada pelo tamanho da defesa)
  R_adequado: 300.0   # canal reservas → prêmio (κ_R; 0 = inativo): 100% da ARA; 363 = caso pessimista
  # Fiscal (governo central; regras de indexação, crescimento real % a.a.)
  eps_rec: 1.0         # elasticidade da receita ao hiato (0,8–1,3)
  g_salario_minimo: 1.0    # ganho real do salário mínimo
  veg_previdencia: 2.0     # crescimento vegetativo de benefícios previdenciários
  g_pessoal: 0.5           # crescimento real da folha
  g_outras_obrig: 2.0      # BPC, abono etc. (indexados ao salário mínimo + vegetativo)
  limite_min: 0.6          # arcabouço: crescimento real mínimo da despesa
  limite_max: 2.5          # arcabouço: crescimento real máximo da despesa
  limite_frac_receita: 0.7 # arcabouço: fração do crescimento real da receita
  disc_min: 1.2            # piso de discricionárias (% PIB) para funcionamento da máquina
  # Juros longos: term premium converge de tp_0 (calibrado no t0) para tp_lp = r_long_neutro − r_neutro_base
  tau_tp: 6.0          # trimestres (4–12); meia-vida ≈ 4 trimestres
  # Inflação: especificações P2 e P3 (P1 usa b1, b2, b3 acima)
  b2_p2: 0.025         # P2, Phillips achatada (grade 0–0,15)
  b2_p3: 0.025         # P3, inclinação residual (0–0,05)
  peso_fiscal_expect: 1.0  # P3, peso de (1 − λ_π)·π_fiscal[t−1] nas expectativas (variantes 0 e 0,5)
  theta: 0.5           # P3, fração da lacuna absorvida por inflação (0,25–1,0)
  phi: 0.0             # P3, fração da lacuna inicial ainda não precificada (0–0,5)
  delta_min: 0.5       # P3, piso de (r − g) no valor terminal, p.p. (0,25–1,0)
  escala_vt: 1.0       # P3, valor terminal s/max(r−g, Δ_min): 1 = fórmula literal da especificação;
                       # 100 = perpetuidade em unidades consistentes (variante vt_perpetuidade)
  p2_p3: 0.15          # P3, p2 reduzido (metade) para não contar a lacuna duas vezes (0–0,3)
  H_vp: 40             # P3, horizonte explícito do valor presente (trimestres)
  dur_fx: 5.0          # P3, duração da dívida cambial (anos)
  # Restrição de rolagem da LFT
  rolagem: true
  r_min_rolagem: 1.0   # juro real mínimo aceito para carregar LFT (0–2,0)
  banda_rolagem: 2.0   # suavização da migração (p.p.)
  monetizacao: false   # true: o excesso vira expansão monetária (flag --monetizacao)
  psi_monet: 1.0       # p.p. de inflação por 1% da dívida monetizada
  # Explosão inflacionária: trajetória encerrada acima deste nível (% a.a.)
  pi_explosao: 50.0
  # Guarda numérica
  pi_min: -5.0

criterios:
  tolerancia_divida: 5.0     # p.p. do PIB acima da dívida inicial
  janela_final: 8            # trimestres usados para inclinação e média
  tolerancia_inflacao: 1.5   # p.p. acima da meta
  tolerancia_inflacao_alt: 2.0   # sensibilidade do teto (meta + 2,0)
  teto_explosivo: 20.0       # inflação em qualquer trimestre acima disto = inflação explosiva
  reservas_janela: true      # R ≥ R_min só nos últimos 8 trimestres (a defesa pode romper o piso no choque)

estimacao:
  usar_estimados: true       # usa estimativas OLS quando passam nos testes de sinal/faixa
  amostra_inicio: "2004-01-01"
  excluir_inicio: "2020-01-01"
  excluir_fim: "2020-12-31"
  faixas:
    a1: [0.5, 0.85]
    a2: [0.05, 0.3]
    b1: [0.4, 0.8]
    b2: [0.05, 0.3]
    b3: [0.03, 0.12]
    c1: [0.2, 5.0]
    c2: [0.2, 6.0]

